<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><title>Spring · cámara AR</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script><style>body{margin:0;overflow:hidden}#hint{position:fixed;top:12px;left:12px;right:12px;z-index:10;background:rgba(0,0,0,.75);color:white;font:15px system-ui;padding:12px;border-radius:8px;pointer-events:none}</style></head><body><div id="hint" role="status">Permite el acceso a la cámara y apunta al marcador Hiro. Cargando modelo…</div><a-scene embedded vr-mode-ui="enabled: false" renderer="colorManagement: true; antialias: true" arjs="sourceType: webcam; debugUIEnabled: false;"><a-assets timeout="60000"><a-asset-item id="spring" src="spring-marker.glb"></a-asset-item></a-assets><a-marker preset="hiro" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2"><a-entity id="model" gltf-model="#spring"></a-entity></a-marker><a-entity camera></a-entity></a-scene><script>const hint=document.getElementById('hint'); document.getElementById('model').addEventListener('model-loaded',()=>{hint.textContent='Apunta al marcador Hiro completo para ver la maqueta.'}); document.getElementById('model').addEventListener('model-error',()=>{hint.textContent='No se pudo cargar el modelo. Comprueba tu conexión y vuelve a intentarlo.'}); document.querySelector('a-marker').addEventListener('markerFound',()=>{hint.textContent='Marcador detectado. Mantén el dibujo visible.'}); document.querySelector('a-marker').addEventListener('markerLost',()=>{hint.textContent='Apunta de nuevo al marcador Hiro completo.'});</script></body></html>
