<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Camera — Agios Athanasios Fountain</title><link rel="stylesheet" href="style.css"><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script><style>body{overflow:hidden}</style></head><body><div id="hint" class="camera-hint" role="status">Allow camera access and point at the Hiro marker. Loading the model…</div><a class="camera-back" href="./">← Back</a><a-scene embedded vr-mode-ui="enabled: false" renderer="colorManagement: true; antialias: true" arjs="sourceType: webcam; debugUIEnabled: false;"><a-assets timeout="60000"><a-asset-item id="spring" src="spring-marker.glb"></a-asset-item></a-assets><a-marker preset="hiro" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2"><a-entity id="model" gltf-model="#spring"></a-entity></a-marker><a-entity camera></a-entity></a-scene><script>const hint=document.getElementById('hint'); document.getElementById('model').addEventListener('model-loaded',()=>{hint.textContent='Point at the entire Hiro marker to see the model.'}); document.getElementById('model').addEventListener('model-error',()=>{hint.textContent='The model could not be loaded. Check your connection and try again.'}); document.querySelector('a-marker').addEventListener('markerFound',()=>{hint.textContent='Marker found. Keep it in view.'}); document.querySelector('a-marker').addEventListener('markerLost',()=>{hint.textContent='Point at the entire Hiro marker again.'});</script></body></html>
