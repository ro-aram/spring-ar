<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agios Athanasios Fountain — AR model</title>
<link rel="stylesheet" href="style.css">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
<style>body{overflow:hidden}#arjs-video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;margin:0!important;object-fit:cover!important;object-position:center!important}.camera-links{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:16px;z-index:10;display:flex;gap:8px}.camera-links a{background:white;color:#151515;padding:10px 14px;border:1px solid #777;text-decoration:none;font-size:14px}</style>
</head>
<body>
<div id="hint" class="camera-hint" role="status" aria-live="polite">Allow camera access and point at the Hiro marker. Loading the model…</div>
<nav class="camera-links" aria-label="Information"><a href="about.html">About</a><a href="hoja.html">Print marker</a></nav>
<a-scene embedded vr-mode-ui="enabled: false" renderer="colorManagement: true; antialias: true" arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; debugUIEnabled: false;">
<a-assets timeout="60000"><a-asset-item id="spring" src="spring-light.glb"></a-asset-item></a-assets>
<a-marker preset="hiro" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2"><a-entity id="model" gltf-model="#spring"></a-entity></a-marker>
<a-entity camera></a-entity>
</a-scene>
<script>
const hint = document.getElementById('hint');
const model = document.getElementById('model');
const marker = document.querySelector('a-marker');
let modelState = 'loading';
let markerVisible = false;
function updateStatus() {
  if (modelState === 'error') {
    hint.textContent = 'The model could not be loaded. Check your connection and reload the page.';
  } else if (modelState === 'loading') {
    hint.textContent = markerVisible ? 'Marker found. Loading the 3D model…' : 'Loading the 3D model… Allow camera access and point at the Hiro marker.';
  } else {
    hint.textContent = markerVisible ? 'Model loaded. Keep the marker in view.' : 'Model loaded. Point at the entire Hiro marker.';
  }
}
model.addEventListener('model-loaded', () => { modelState = 'loaded'; updateStatus(); });
model.addEventListener('model-error', () => { modelState = 'error'; updateStatus(); });
document.getElementById('spring').addEventListener('error', () => { modelState = 'error'; updateStatus(); });
marker.addEventListener('markerFound', () => { markerVisible = true; updateStatus(); });
marker.addEventListener('markerLost', () => { markerVisible = false; updateStatus(); });
// AR.js assumes a 4:3 frame in portrait; match the actual camera frame instead.
const scene = document.querySelector('a-scene');
function correctCameraSizing() {
  const source = scene.systems.arjs?._arSession?.arSource;
  if (!source || !source.domElement) return false;
  source.copyElementSizeTo = function (target) {
    if (target === document.body) return;
    for (const property of ['width', 'height', 'marginLeft', 'marginTop']) {
      target.style[property] = this.domElement.style[property];
    }
  };
  const resize = source.onResize;
  source.onResize = function (...args) {
    resize.apply(this, args);
    if (scene.canvas) this.copyElementSizeTo(scene.canvas);
  };
  return true;
}
function startSizingFix() {
  if (correctCameraSizing()) return;
  const timer = setInterval(() => { if (correctCameraSizing()) clearInterval(timer); }, 250);
  setTimeout(() => clearInterval(timer), 30000);
}
if (scene.hasLoaded) startSizingFix(); else scene.addEventListener('loaded', startSizingFix);
</script>
</body>
</html>
